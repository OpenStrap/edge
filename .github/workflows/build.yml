name: build

on:
  push:
    tags: ['v*']        # the only trigger: pushing a version tag cuts a release

permissions:
  contents: write       # needed to create the GitHub Release

jobs:
  # PREFLIGHT. Every version guard lives here, in its own job, and BOTH
  # release jobs depend on it. It used to sit inside `android`, which meant
  # a version mismatch failed the APK while the `ios` job — having no
  # `needs:` — carried on and published an IPA anyway. The iOS bundle guard
  # in particular was protecting a job it could not stop.
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # all tags, so the versionCode guard can read prior releases' pubspec
          persist-credentials: false   # nothing here writes to the repo

      # Shared with test.yml — but a tag push (this workflow's only trigger)
      # never runs test.yml, so without this the pin-drift guard protected
      # nothing about an actual release. Bit the project on 2026-07-30: edge
      # shipped a full day pinned one merge behind protocol/analytics main,
      # including a decoder fix for a bug that could eat up to 4092 bytes of
      # good historical data, and no release-path check ever saw it.
      - name: Guard — the lock pins sibling commits, and the pins aren't stale
        run: bash .github/scripts/check_sibling_pins.sh

      # Fail the release BEFORE building if the Android versionCode is missing or
      # would go backwards. Flutter derives versionCode from the `+BUILD` suffix
      # of pubspec's `version:` and silently falls back to 1 when it's absent, so
      # `version: 0.9.17+1` shipped v0.9.17 with versionCode 1 — a downgrade from
      # 0.9.15/0.9.16 (versionCode 48). Android then refuses every upgrade install
      # (INSTALL_FAILED_VERSION_DOWNGRADE, shown to users as "App not installed").
      # This guard turns that class of mistake into a red build instead of a
      # broken release.
      - name: Guard — versionCode present, matches tag, and strictly increasing
        run: |
          set -euo pipefail
          ver=$(grep -E '^version:' pubspec.yaml | head -1 | awk '{print $2}')
          name=${ver%%+*}
          build=${ver#*+}

          if [ "$build" = "$ver" ]; then
            echo "::error::pubspec version '$ver' has no +BUILD suffix — versionCode would fall back to 1 and break upgrades."
            exit 1
          fi
          if ! printf '%s' "$build" | grep -qE '^[0-9]+$'; then
            echo "::error::pubspec build number '$build' is not an integer."
            exit 1
          fi

          # The tag being released must match the versionName, so the user-facing
          # version can't drift from the tag (v0.9.16 shipped bytes identical to
          # v0.9.15 because pubspec was never bumped). Suffixed tags such as
          # v0.9.14-whoop5-experimental are allowed against name 0.9.14.
          tag=${GITHUB_REF_NAME#v}
          case "$tag" in
            "$name"|"$name"-*) : ;;
            *) echo "::error::tag '$GITHUB_REF_NAME' does not match pubspec versionName '$name'."; exit 1 ;;
          esac

          # versionCode must exceed the highest already-released versionCode, or
          # the new APK can't install over existing devices.
          max=0
          for t in $(git tag -l 'v*'); do
            [ "$t" = "$GITHUB_REF_NAME" ] && continue
            pv=$(git show "$t:pubspec.yaml" 2>/dev/null | grep -E '^version:' | head -1 | awk '{print $2}' || true)
            b=${pv#*+}
            printf '%s' "$b" | grep -qE '^[0-9]+$' || continue
            [ "$b" -gt "$max" ] && max=$b
          done
          if [ "$build" -le "$max" ]; then
            echo "::error::versionCode $build is not greater than the highest released versionCode $max — installs would be blocked as a downgrade."
            exit 1
          fi
          echo "versionCode $build (versionName $name) OK — exceeds prior max $max."

          # The iOS EMBEDDED bundles (widget extension, Watch app) build their
          # Info.plist from Xcode build settings — GENERATE_INFOPLIST_FILE=YES —
          # not from pubspec. Only the Runner target reads $(FLUTTER_BUILD_NAME),
          # because Flutter's Generated.xcconfig is in scope for that target
          # alone. So MARKETING_VERSION / CURRENT_PROJECT_VERSION in
          # project.pbxproj are a SECOND, hand-maintained source of truth, and
          # when they fall behind a pubspec bump the embedded bundles ship the
          # old version. Apple rejects that outright — an extension or WatchKit
          # app whose CFBundleShortVersionString differs from the host app fails
          # App Store validation — so the whole upload bounces after the build.
          #
          # Pointing them at $(FLUTTER_BUILD_NAME) does NOT work: the variable is
          # undefined for those targets and the versions come out EMPTY. Verified
          # by building and reading the compiled bundles. So they stay literal,
          # and this guard is what keeps them honest.
          #
          # The check is per build-configuration, not a flat grep over the file.
          # A configuration with GENERATE_INFOPLIST_FILE=YES builds its Info.plist
          # from these settings and must carry LITERAL versions matching pubspec;
          # the Runner configurations have no such flag and correctly use
          # $(FLUTTER_BUILD_*), because Runner's checked-in Info.plist substitutes
          # them. Matching only values that start with a digit would skip a
          # variable-valued setting entirely and silently pass the exact
          # misconfiguration that ships empty versions.
          VERSION_NAME="$name" VERSION_BUILD="$build" python3 - <<'PY'
          import os, re, sys

          name  = os.environ['VERSION_NAME']
          build = os.environ['VERSION_BUILD']
          pbx   = 'ios/Runner.xcodeproj/project.pbxproj'
          why   = ('App Store validation rejects an embedded bundle whose version '
                   'differs from the host app, so the upload bounces after the build.')

          bad, checked = [], 0
          for m in re.finditer(r'/\* (\w+) \*/ = \{\s*isa = XCBuildConfiguration;(.*?)\n\t\t\};',
                               open(pbx).read(), re.S):
              cfg, body = m.groups()
              if not re.search(r'\bGENERATE_INFOPLIST_FILE = YES;', body):
                  continue          # Runner: versions come from Runner/Info.plist
              checked += 1
              for key, want in (('MARKETING_VERSION', name), ('CURRENT_PROJECT_VERSION', build)):
                  found = re.search(r'\b%s = ([^;]+);' % key, body)
                  if not found:
                      bad.append('%s: %s config has no %s, so its generated Info.plist '
                                 'would omit the version. %s' % (pbx, cfg, key, why))
                      continue
                  val = found.group(1).strip().strip('"')
                  if '$(' in val:
                      bad.append('%s: %s config has %s = %s -- that build variable is '
                                 'undefined for this target and produces an EMPTY version. %s'
                                 % (pbx, cfg, key, val, why))
                  elif val != want:
                      bad.append('%s: %s config has %s = %s but pubspec says %s. %s'
                                 % (pbx, cfg, key, val, want, why))

          if checked == 0:
              print('::error::%s: found no GENERATE_INFOPLIST_FILE build configurations -- '
                    'the iOS version guard is no longer checking anything.' % pbx)
              sys.exit(1)

          # The other half of the mechanism: the main app must keep tracking pubspec.
          plist = open('ios/Runner/Info.plist').read()
          for key, var in (('CFBundleShortVersionString', '$(FLUTTER_BUILD_NAME)'),
                           ('CFBundleVersion', '$(FLUTTER_BUILD_NUMBER)')):
              got = re.search(r'<key>%s</key>\s*<string>([^<]*)</string>' % key, plist)
              if not got or got.group(1).strip() != var:
                  bad.append('ios/Runner/Info.plist: %s is %s, expected %s -- the main app '
                             'would stop tracking pubspec and this guard would stop meaning '
                             'anything.' % (key, got.group(1).strip() if got else 'absent', var))

          for b in bad:
              print('::error::%s' % b)
          if bad:
              sys.exit(1)
          print('iOS embedded-bundle versions match pubspec (%s / %s) across %d build '
                'configurations.' % (name, build, checked))
          PY

  android:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      # Shallow: the guard that needed full tag history now runs in `preflight`, and
      # nothing in this job reads git. `generate_release_notes` builds its diff on
      # GitHub's side from the tag, not from local history — the ios job has always
      # run shallow and attaches to the same release without trouble.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # nothing here writes to the repo

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          # Bump deliberately, not by drift.
          flutter-version: '3.41.6'

      # The single companion URL (announcements, OTA, telemetry, import) comes
      # from a repo secret, written into .env and baked in via --dart-define.
      - name: Write .env
        run: |
          echo "COMPANION_URL=${{ secrets.COMPANION_URL }}" > .env
          echo "BACKEND_URL=${{ secrets.BACKEND_URL }}" >> .env
          # Health-data contribution: this flag makes the feature EXIST in
          # the binary (matches the ios job). It does not enable anything —
          # the pref defaults off and the upload additionally requires the
          # user to switch on Settings > Privacy > "Contribute my health
          # data". Verify that row still exists before touching this line:
          # this comment used to assert the toggle as a backstop at a time
          # when the toggle had no UI at all, and that false reassurance is
          # how PRIVACY.md ended up describing a control nobody could reach.
          # See kHealthDataContributionEnabled in
          # lib/telemetry/health_uploader.dart.
          echo "ENABLE_HEALTH_DATA_CONTRIBUTION=true" >> .env

      # Decode the release keystore from a secret. The gradle config picks these
      # env vars up (ANDROID_KEYSTORE_PATH etc.) and signs the release build.
      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - run: flutter pub get

      - name: Mount Firebase Secrets
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
          FIREBASE_OPTIONS_DART_B64: ${{ secrets.FIREBASE_OPTIONS_DART_B64 }}
        run: |
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > android/app/google-services.json
          echo "$FIREBASE_OPTIONS_DART_B64" | base64 -d > lib/firebase_options.dart

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --dart-define-from-file=.env

      - name: Name the APK after the version
        id: rename
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/openstrap-edge-${GITHUB_REF_NAME}.apk
          echo "apk=dist/openstrap-edge-${GITHUB_REF_NAME}.apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: openstrap-edge-apk
          path: ${{ steps.rename.outputs.apk }}

      # Publish a Release with the signed APK attached so people download a real
      # .apk, not a zipped CI artifact.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.rename.outputs.apk }}
          generate_release_notes: true

  # Keeps the F-Droid build recipe (docs/fdroid/*.yml) in sync with each
  # release and, once a fdroiddata fork is configured, pushes the updated
  # recipe there as a merge request. F-Droid builds from source itself (see
  # docs/fdroid/wtf.openstrap.openstrap_edge.yml's header for the full
  # rationale/verification) — this job never ships a binary to F-Droid, it
  # only keeps the recipe's versionName/versionCode/commit current so the
  # inclusion (or an update) has something correct to build. After the FIRST
  # inclusion is merged, F-Droid's own AutoUpdateMode:Version +
  # UpdateCheckMode:Tags bot picks up ordinary tags on its own — this job's
  # ongoing job is mainly a safety net for now, and the sole mechanism before
  # that first inclusion exists.
  #
  # Deliberately does NOT fail the release if fdroiddata isn't configured yet
  # (no FDROID_GITLAB_TOKEN secret) — F-Droid isn't wired up until the first
  # inclusion MR is manually opened and merged; this job just keeps the draft
  # recipe current in the meantime and does the rest once it is wired up.
  fdroid:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # nothing here writes to THIS repo

      # Stamp the release's real versionName/versionCode/commit into the
      # checked-in draft recipe. Plain sed rather than a YAML library: the
      # three fields each appear in exactly one recognizable spot in the file
      # (see docs/fdroid/wtf.openstrap.openstrap_edge.yml), and keeping this
      # a shell one-liner means no extra Python deps for a 3-line edit.
      - name: Stamp release version into the fdroid recipe
        run: |
          set -euo pipefail
          ver=$(grep -E '^version:' pubspec.yaml | head -1 | awk '{print $2}')
          name=${ver%%+*}
          build=${ver#*+}
          tag="$GITHUB_REF_NAME"
          f=docs/fdroid/wtf.openstrap.openstrap_edge.yml
          sed -i \
            -e "s/^\([[:space:]-]*versionName:[[:space:]]*\).*/\1$name/" \
            -e "s/^\([[:space:]]*versionCode:[[:space:]]*\).*/\1$build/" \
            -e "s/^\([[:space:]]*commit:[[:space:]]*\)[^ ]*/\1$tag/" \
            -e "s/^CurrentVersion:.*/CurrentVersion: $name/" \
            -e "s/^CurrentVersionCode:.*/CurrentVersionCode: $build/" \
            "$f"
          echo "Stamped $f -> versionName=$name versionCode=$build commit=$tag"

      # Push the stamped recipe to a fdroiddata fork and open/update a merge
      # request, ONLY once that fork + token are configured. Until then this
      # step just explains what's missing and exits clean — the release
      # itself must never fail on account of F-Droid plumbing.
      - name: Sync recipe to fdroiddata fork
        env:
          FDROID_GITLAB_TOKEN: ${{ secrets.FDROID_GITLAB_TOKEN }}
          FDROID_FORK_REPO: ${{ vars.FDROID_FORK_REPO }}   # e.g. https://gitlab.com/yourname/fdroiddata.git
        run: |
          set -euo pipefail
          if [ -z "${FDROID_GITLAB_TOKEN:-}" ] || [ -z "${FDROID_FORK_REPO:-}" ]; then
            echo "::notice::FDROID_GITLAB_TOKEN / FDROID_FORK_REPO not set — skipping fdroiddata sync."
            echo "::notice::One-time setup: fork https://gitlab.com/fdroid/fdroiddata, add a GitLab"
            echo "::notice::personal access token as the FDROID_GITLAB_TOKEN secret and the fork's"
            echo "::notice::clone URL as the FDROID_FORK_REPO repo variable. Until the first"
            echo "::notice::inclusion MR is opened and merged by hand, this step has nothing to do."
            exit 0
          fi

          branch="update-openstrap-edge-${GITHUB_REF_NAME}"
          workdir="$RUNNER_TEMP/fdroiddata"
          repo_url="${FDROID_FORK_REPO/https:\/\//https:\/\/oauth2:${FDROID_GITLAB_TOKEN}@}"

          git clone --depth 1 "$repo_url" "$workdir"
          cp docs/fdroid/wtf.openstrap.openstrap_edge.yml \
            "$workdir/metadata/wtf.openstrap.openstrap_edge.yml"

          cd "$workdir"
          git checkout -b "$branch"
          git -c user.name="openstrap-release-bot" -c user.email="noreply@openstrap.wtf" \
            commit -am "wtf.openstrap.openstrap_edge: update to ${GITHUB_REF_NAME}" \
            --allow-empty -- metadata/wtf.openstrap.openstrap_edge.yml
          git push -u origin "$branch" \
            -o merge_request.create \
            -o merge_request.title="wtf.openstrap.openstrap_edge: update to ${GITHUB_REF_NAME}" \
            -o merge_request.target=fdroid/fdroiddata

  # Unsigned iOS .ipa for sideloading (AltStore / Sideloadly / TrollStore). It is
  # NOT App Store signed — users re-sign it with their own Apple ID on install.
  # Note: free-account sideloads re-sign with a different team id, so App Group
  # features (home widget + Live Activity) may not work; there is no iOS OTA
  # auto-update either (that path installs an .apk). Attached to the same release.
  #
  # The Watch companion app is deliberately NOT embedded in this artifact — see
  # the "Strip Watch companion" step below. It is structurally impossible for
  # it to survive a per-user free-account resign: the Watch app's Info.plist
  # carries a literal WKCompanionAppBundleIdentifier string that must exactly
  # equal the phone app's bundle id, and every free-account resign (Sideloadly,
  # AltStore, ...) mints its own unique per-user bundle id suffix to satisfy
  # Apple's global App-ID-uniqueness rule but has no reason to know it also
  # needs to patch that unrelated-looking key inside a different nested
  # bundle's plist — none of them do. Unlike widget/Live-Activity extensions
  # (which associate with the parent purely by PlugIns/ embedding + a simple
  # bundle-id prefix, both of which survive naive resigning fine), this is not
  # a Sideloadly bug to work around — it fails identically under every
  # resigner. Full Watch support only ever works building from source with a
  # consistent signing identity (see ios/Config/Signing.xcconfig + `flutter
  # run`/Xcode direct install), where $(APP_BUNDLE_IDENTIFIER) threads through
  # every target's plist, including this one, at build time.
  ios:
    needs: preflight
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # nothing here writes to the repo

      - uses: subosito/flutter-action@v2
        with:
          # PINNED, not `channel: stable` — that floats forward every run and
          # has twice broken this exact release pipeline on version drift:
          # a newer Flutter removed/moved CupertinoPageTransitionsBuilder
          # (theme.dart wouldn't compile) and changed how --no-codesign
          # propagates to the Watch companion target (iOS build demanded a
          # signing team despite --no-codesign). This version is verified
          # against the current codebase (376 tests + a local release build
          # of both platforms). Bump deliberately, not by drift.
          flutter-version: '3.41.6'

      - name: Write .env
        run: |
          echo "COMPANION_URL=${{ secrets.COMPANION_URL }}" > .env
          echo "BACKEND_URL=${{ secrets.BACKEND_URL }}" >> .env
          # Health-data contribution: this flag makes the feature EXIST in
          # the binary (matches the android job). It does not enable
          # anything — the pref defaults off and the upload additionally
          # requires the user to switch on Settings > Privacy > "Contribute
          # my health data". Verify that row still exists before touching
          # this line: this comment used to assert the toggle as a backstop
          # at a time when the toggle had no UI at all, and that false
          # reassurance is how PRIVACY.md ended up describing a control
          # nobody could reach. GitHub Releases is the only channel that
          # exists; there is no store pipeline, so nothing here distinguishes
          # one. See kHealthDataContributionEnabled in
          # lib/telemetry/health_uploader.dart.
          echo "ENABLE_HEALTH_DATA_CONTRIBUTION=true" >> .env

      - name: Install flutterfire (required by Crashlytics Xcode build phase)
        run: dart pub global activate flutterfire_cli 1.4.0

      - run: flutter pub get

      - name: Mount Firebase Secrets
        env:
          GOOGLE_SERVICE_INFO_PLIST_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_B64 }}
          FIREBASE_OPTIONS_DART_B64: ${{ secrets.FIREBASE_OPTIONS_DART_B64 }}
        run: |
          echo "$GOOGLE_SERVICE_INFO_PLIST_B64" | base64 -d > ios/Runner/GoogleService-Info.plist
          echo "$FIREBASE_OPTIONS_DART_B64" | base64 -d > lib/firebase_options.dart

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign --dart-define-from-file=.env

      # See the job-level comment above: the Watch companion cannot survive a
      # per-user free-account resign under any sideloading tool (Sideloadly,
      # AltStore, ...) — it fails install for every such user, every time, with
      # no per-app-side fix possible, because the resign step would need to
      # rewrite a cross-reference key inside a different nested bundle's plist
      # that these tools don't special-case. Drop it here so the artifact this
      # job ships actually installs; source builds keep full Watch support.
      - name: Strip Watch companion (can't survive per-user resigning)
        run: rm -rf "build/ios/iphoneos/Runner.app/Watch"

      - name: Package unsigned IPA
        id: ipa
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/Runner.app
          IPA="$GITHUB_WORKSPACE/openstrap-edge-${GITHUB_REF_NAME}-unsigned.ipa"
          zip -qr -y "$IPA" Payload
          echo "ipa=openstrap-edge-${GITHUB_REF_NAME}-unsigned.ipa" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: openstrap-edge-ipa
          path: ${{ steps.ipa.outputs.ipa }}

      # Attach to the same Release the android job created/updates (upsert by tag).
      - name: Attach IPA to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.ipa.outputs.ipa }}
