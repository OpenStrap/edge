name: skip-flake-probe

on:
  push:
    branches: [fix/derive-skip-test-flake]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Equivalence test, repeated
        run: |
          nproc
          fails=0
          for i in 1 2 3 4 5 6; do
            echo "=== run $i"
            if ! flutter test --concurrency=1 --reporter=expanded \
                test/derive_unchanged_skip_test.dart \
                --plain-name "stores exactly what deriving them does" \
                2>&1 | grep -v '^\[' | tail -40; then :; fi
          done
