name: openstrap_edge
description: "Open-source, local-first fitness tracking companion for WHOOP 4.0 hardware. Not affiliated with WHOOP, Inc."
publish_to: 'none'
# NOTE: bumping this also requires manually bumping MARKETING_VERSION/
# CURRENT_PROJECT_VERSION for the OpenStrapWidget(Extension) and "OpenStrapWatch
# Watch App" targets in ios/Runner.xcodeproj/project.pbxproj — they aren't wired
# to FLUTTER_BUILD_NAME/FLUTTER_BUILD_NUMBER. See guides/IOS_INSTALLATION.md
# "Version Numbers".
version: 0.9.28+60

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # The single icon family behind lib/ui2. One pack, one stroke weight, one
  # optical size — replacing the five-pack mix the old design system blended
  # per concept, which is why no two screens' icons quite matched. Lucide is
  # what the interface was drawn in; keeping it means a screen can name the
  # glyph the design names.
  lucide_icons_flutter: ^3.1.15

  # Local pure-Dart packages — the protocol byte codecs and the metric/analytics
  # engine. Replace the old cloud backend: decode happens on-device, and the
  # local re-layer computes metrics here (see lib/data/local_repository.dart +
  # lib/compute/derivation_engine.dart). The analytics package now points at the
  # 1 Hz-native family (import via `package:openstrap_analytics/onehz.dart`).
  # SIBLING PACKAGES ARE PINNED TO COMMIT SHAs, NOT FLOATING `main`/BRANCH REFS.
  # A floating ref means an upstream commit silently changes the behaviour of an
  # already-tagged edge release (this bit us: analytics v42 rode `ref: main` into
  # 0.9.13/0.9.14 with no edge change and shipped the main-thread staging ANRs).
  # Bump these SHAs deliberately, as part of a reviewed edge change. Local dev
  # still builds against ../analytics and ../protocol via pubspec_overrides.yaml.
  # NOTE: this is the multiband branch, so protocol is pinned at the gen5 work
  # rather than plain `main`. Prefer merge commits on `main` over PR-branch
  # heads where possible — a deleted branch can orphan a PR-branch SHA.
  openstrap_protocol:
    git:
      url: https://github.com/OpenStrap/protocol.git
      # protocol PR #27 head. main deliberately stays on a pre-gen5 SHA so the
      # multiband surface doesn't ride in as a side effect of unrelated work —
      # that is the right call THERE. This is the branch that wants it.
      #
      # Carries the gen5 decoders plus the fixes from #27: command responses
      # have two more header bytes than we assumed (body location was reading
      # the status byte as the location), GET_CLOCK/GET_DATA_RANGE read their
      # fields instead of scanning for them, the R22 config values were
      # inverted, and the gen4 optical fields are deprecated with what they
      # actually are.
      # protocol main @ #27 merge. Carries the gen5 command/decoder fixes plus
      # the decode-integrity work: a record only decodes if its packet type says
      # it is one, r-r beats are read only where the field map is confirmed, and
      # a frame whose payload crc32 fails no longer lets its declared length
      # swallow the frames behind it.
      #
      # protocol `fix/gen5-bounds-and-write-guard` @ e33e53a — the sweep half.
      # gen4 record versions we never confirmed a field map for (v7/v9/v18 and
      # unknown) stop publishing spo2/skin-temp/ppg/ambient off that guess and
      # report absent instead; a gen5 v18 record with an out-of-range HR byte
      # now decodes with hr absent instead of being thrown at raw_archive whole;
      # gen4 bounds are no longer applied to gen5; HelloInfo.wristOn/.charging
      # are always null (wear comes from WRIST_ON/OFF and the realtime wearing
      # bit). v24/v12 — what our own straps ship — are byte-for-byte unchanged.
      #
      # Pushed (2026-08-19) on `fix/gen5-bounds-and-write-guard`, so a fresh
      # checkout resolves it. The branch has moved on since (decodeFrame now
      # emits R10 beat intervals) — deliberately NOT repinned: edge never reads
      # `rr_ms` off decodeFrame, so the hop changes no number here and a repin
      # would drag kAlgoVersion with it for nothing.
      #
      # Repinned to the #27 head after its own review pass. NO kAlgoVersion
      # bump: the fixes only reject NaN/±inf, which was never a measurement, so
      # for any user whose data is valid the output is byte-identical.
      #
      # REPIN (this branch): protocol main @ b7990e1, the #31 merge commit.
      # #31 carries the gen5 hello map, the real clock opcodes and the v18
      # record field map this branch's decoders need. main's pre-gen5 pin is
      # deliberate THERE; this is the branch that wants gen5.
      #
      # REPIN (this branch): protocol #33 head @ 4ce8f02, which is b7990e1
      # (everything above) rebased under #33's one commit — alarmRev1Payload,
      # the single home of the rev-1 9-byte SET_ALARM_TIME layout this branch
      # arms gen4 with. b7990e1 itself does NOT export the symbol, so the old
      # pin failed analysis on a fresh checkout. #33 is unmerged, so this is a
      # PR-branch-head pin; repin to the main merge commit when it lands.
      ref: 4ce8f021568a4cd9a1d86c91004f91c6b21980da
  openstrap_analytics:
    git:
      url: https://github.com/OpenStrap/analytics.git
      # analytics main @ #34 merge. Two hops in one: #32 (the HR-onset bypass
      # for low-limb-swing cardio) had already merged and this pin was still
      # sitting on its PR-branch head, and #34 lands the sleep-stager rewrite.
      #
      # #34 replaces the deep/REM boolean conjunctions with weighted robust-z
      # scores. Measured against 99 PSG-labelled wrist nights (DREAMT), the old
      # rules scored kappa 0.036 — deep PPV 5.7% against a 4.5% base rate, REM
      # 12.1% against 14.0%, i.e. at or below chance — because the deep rule
      # AND-ed one good axis, one null axis (rmssd, d -0.13) and one INVERTED
      # axis (mean HR, d +0.31), so they could only co-fire by luck. That is
      # what produced 30-second deep specks the 3-min bout rule then deleted.
      # Now kappa 0.128 (0.132 held out), deep 53.0/12.9 sens/PPV, REM
      # 52.6/20.7. Cutoffs are calibrated on OUR captures, not DREAMT — the
      # DREAMT-optimal values under-called REM badly on real WHOOP data.
      # Verified present: `git show <sha>:lib/src/onehz/sleep/cardio_stager.dart
      #   | grep -E 'classifyCardioEpochs|_remScoreCut = 0.5'`.
      #
      # analytics main @ #35 merge (1fb34dc). Neither side of this conflict was
      # right: HEAD had #35's PR-BRANCH head (38a8636, never on main) and main
      # had the older #38 merge (c3a30be). This SHA is analytics main and carries
      # all three hops this release needs -- #38 (nap detector), #39 (the awake-HR
      # baseline P0 that shipped inside #38), and #35 (the 1 Hz step estimate
      # deleted + movement minutes on measured evidence), the sibling half of
      # THIS branch.
      #
      # Verified against the SHA: `dailyStepEstimate` absent,
      # `dailyActiveMinutes` present in lib/src/onehz/motion/steps.dart.
      #
      # analytics main @ #41 merge (ebe45da). Adds `journalNumericCorrelations`
      # — Spearman rho + Theil-Sen slope over journal fields that carry a dose,
      # which the typed journal entries shipped in edge #218 had no way to
      # correlate. Nothing else changed; #41 only appends to coaching.dart.
      #
      # Verified against the SHA:
      #   `git show ebe45da:lib/src/onehz/human/coaching.dart |
      #      grep -E 'journalNumericCorrelations|class JournalNumericDay'`
      #
      # analytics main @ #42 merge (e047c59). Names the sample gap cap that
      # `estimateBoutCalories` applies when the next HR sample is late, so the
      # live workout scorer in app_state can read the same 150 s rather than
      # restating it. A default-argument literal is unreachable from another
      # package, so the second copy was going to drift the day the cap moved.
      #
      # Verified against the SHA:
      #   `git show e047c59:lib/src/onehz/workout/calories.dart |
      #      grep defaultMergeGapCapS`
      #
      # analytics `fix/numerical-correctness` @ beaeafa. THE PIN ABOVE WAS
      # STALE: it sat on cef6fe4 (#45) while the comment described e047c59 and
      # every local run built ../analytics through pubspec_overrides.yaml, so
      # kAlgoVersion 67 and 68 both documented analytics behaviour the pinned
      # SHA had never contained — the v43 failure, again. The two commits this
      # moves to are what those entries were actually written against, plus the
      # sweep: Welch-averaged band powers in ms²/Hz, `ulf` absent rather than
      # 0.0, nullable `round6`, correctRr advancing its clock by the real
      # interval on a corrected beat, baselines withheld until a real night is
      # folded, the resting-HR percentile-of-you oriented lower-is-better, the
      # circadian non-parametrics omitted when an hour was never observed, and
      # `meaningful` off readiness_composite. `sex`/`age` are gone from
      # vo2maxEstimate and physiologicalAge, so this pin and
      # crossday_pipeline.dart must move together.
      #
      # The pins are also asserted from lib/compute/derivation_engine.dart
      # (kAnalyticsPin/kProtocolPin) — repin without visiting the version gate
      # and the suite goes red, because kAlgoVersion alone cannot tell two
      # different analytics apart.
      #
      #
      # analytics `fix/numerical-correctness` @ 98d42b6 — the device seam, at
      # kAlgoVersion 70. One commit on top of beaeafa, and the one every
      # family-dispatched metric in edge needs: `lib/src/onehz/device.dart`
      # (DeviceFamily, deviceFamilyOf() -> null on anything unrecognised,
      # calibrationFor() -> null rather than gen4's constants). It also lands
      # Benjamini-Hochberg over the 9x4 journal-correlation grid (findings
      # disappear; empty is a real answer), binary habits routed to
      # difference-of-means instead of a rho, hrRecovery's fitted tau,
      # Kruskal-Wallis + permutation on the weekday effect, sleep runs
      # terminating at unobserved, per-cycle depths/widths out of the apnea
      # screen, and the removal of vo2maxEstimate/physiologicalAge — edge
      # stopped calling those two before this pin, so nothing loses a value.
      #
      # Verified against the SHA:
      #   `git show 98d42b6:lib/src/onehz/device.dart |
      #      grep -E 'enum DeviceFamily|calibrationFor|unknownFamilyNote'`
      #
      # analytics `fix/numerical-correctness` @ 391ede4 — analytics HEAD, and
      # what kAlgoVersion 71 is pinned against. This is the commit that landed
      # the nine symbols edge lib/ was already calling and 98d42b6 did not have
      # (alertnessForecast, AlertnessForecast, CvhrNight, CvhrDistribution,
      # cvhrPersonalDistribution, cvhrDistributionWindowNights, StageInterval,
      # stageIntervals, journalFieldLagDays) plus observed_max_hr, session_cost,
      # night_hrv_shape, cycle_lengths and the cvhr apnea screen. The "a clean
      # checkout does not compile" warning that used to sit here is RESOLVED —
      # checked symbol by symbol against this SHA.
      #
      # Verified against the SHA:
      #   `git show 391ede4:lib/src/onehz/human/alertness_forecast.dart | head -1`
      #   `git show 391ede4:lib/src/onehz/device.dart |
      #      grep -E 'enum DeviceFamily|calibrationFor|unknownFamilyNote'`
      #
      # The "pin is behind the working copy" warning that used to sit here is
      # RESOLVED. The algorithms-audit wave (readiness refusing on a cold start,
      # the RMSSD jitter gate, the active-energy correction, the EWMA baseline
      # fix, BH-corrected journal insights) was uncommitted when that was
      # written; it is committed now and this SHA is the tip of it, so what
      # kAlgoVersion 71's changelog describes is what a clean checkout builds.
      # The pin also moved 391ede4 -> 21664f8 without the prose above following
      # it — the `git show` lines still read true against either.
      #
      # `fix/numerical-correctness` merged to main as PR #46 (bfea5e5); the pin
      # moved 21664f8 -> bfea5e5 to track it. Diff between the two is two
      # test-only deprecation-ignore annotations (analytics `lib/` untouched),
      # so kAlgoVersion needs no bump for this move.
      #
      # Repinned again after that branch's own review pass. Still no bump, same
      # reason: the change rejects NaN/±inf inputs and nothing else, and a NaN
      # was never a reading. `dailyEnergy` returns a nullable record now — it
      # abstains rather than billing every waking minute as active when the
      # anchors are unusable — which is source-breaking here, not
      # number-changing (see `onehz_pipeline` and `_dailyEnergy`).
      ref: d9362a66fbeac326d5d7d7b1fe27b28e41169a79

  # BLE — flutter_blue_plus is the maintained cross-platform GATT client.
  flutter_blue_plus: ^1.36.8

  # Local raw-first storage.
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5

  # Unwrapping the archives users actually pick on the import screen: a WHOOP
  # "My Data" export is a ZIP of CSVs, and a NOOP `.noopbak` is a ZIP holding a
  # SQLite database (issues #199, #160). Already present transitively; declared
  # directly because `lib/import/import_container.dart` imports it.
  archive: ^4.0.9

  # Passphrase-encrypted backup (lib/import/backup_crypto.dart). A vetted,
  # long-standing pure-Dart implementation of AES-256-GCM and
  # PBKDF2-HMAC-SHA256 — no hand-rolled construction, and no platform channel,
  # so the round trip is testable headless. `crypto` (already transitive) has
  # HMAC but no AEAD, which is the one primitive that must not be improvised.
  pointycastle: ^3.9.1

  # Background scheduled derivation (the heavy nightly pass: sleep staging +
  # 24-h spectra). Android: a real OS-scheduled WorkManager job. iOS: see the
  # honest caveat in lib/compute/background_derivation.dart — app-killed heavy
  # compute is opportunistic via BGTaskScheduler, never guaranteed.
  workmanager: ^0.9.0

  # HTTP — retained ONLY for the OTA self-update pointer (see lib/sync/update_service.dart)
  # and the AI Coach's direct LLM (BYOK) calls. No backend / auth traffic anymore.
  http: ^1.2.2

  # Barcode scanning for the food log (lib/ui2/screens/scan_barcode.dart).
  #
  # The floor is not cosmetic: 7.3.0 and 7.4.0 fixed a controller-dispose bug
  # that tore down ANOTHER controller's camera, and an Apple `captureOutput`
  # race. This app holds a camera nowhere else today, but the first bug is the
  # kind that only shows up once it does.
  #
  # The default Android config links the BUNDLED ML Kit model, which is what we
  # want: +3-10 MB of APK in exchange for needing no Google Play Services at
  # all, on a build distributed through GitHub Releases. Do NOT set the
  # `useUnbundled` Gradle property.
  mobile_scanner: ^7.3.1

  # State + small settings persistence.
  provider: ^6.1.2
  shared_preferences: ^2.3.3

  # Charts (for the future server-analytics view).
  fl_chart: ^0.69.2

  # Interactive maps for GPS workout routes (run/ride/walk). Raster tiles are
  # fetched on demand from CARTO (basemaps.cartocdn.com) — OSM data, but served
  # by CARTO rather than tile.openstreetmap.org, whose tile-usage policy does
  # not permit app traffic. No cloud API keys, no Google/Mapbox. The
  # "© OpenStreetMap contributors" attribution is rendered on every map.
  # Recorded GPS points are stored on-device only (workout_route table) and are
  # never uploaded — but the tile requests do tell CARTO which area is on
  # screen, which PRIVACY.md states.
  # flutter_map_tile_caching (offline tile cache) is a documented follow-up — it
  # pulls heavier native storage deps, so v1 uses live CARTO tiles only.
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2

  # Type: Manrope + Barlow Condensed are BUNDLED under assets/fonts/ (declared
  # in flutter.fonts below), not pulled at runtime — see the note there.

  # Declarative motion (flutter_animate) and the five-pack icon mix that
  # backed lib/ui/kit/os_icons.dart went with lib/ui. lib/ui2 has one icon
  # family (lucide_icons_flutter, declared above) and one motion gate
  # (lib/ui2/theme.dart), so none of them have a consumer any more.
  #
  # phosphor_flutter also no longer COMPILES against the current Flutter SDK —
  # `IconData` became a final class, and PhosphorIconData extends it — which is
  # what was failing 33 test files on main before this branch.

  # Structural deep-equality (series_codec's verifyLossless) — was transitive
  # via flutter itself; declared directly since lib/ code now imports it.
  collection: ^1.18.0

  # Injectable clock (RouteTracker's stall watchdog) — was a transitive dep via
  # fake_async/flutter_test; declared directly since lib/ code now imports it.
  # `clock.now()` instead of raw DateTime.now() lets fakeAsync tests control
  # time deterministically instead of needing a real multi-second sleep.
  clock: ^1.1.2

  # Share recap cards (rendered card → image → share sheet).
  share_plus: ^10.1.4

  # File picker for data imports (NOOP raw CSV, Edge .db backup, WHOOP export CSV).
  file_picker: ^8.1.6

  # Apple Health (HealthKit, iOS) + Google Health Connect (Android) — export each
  # day's derived metrics to the platform health store.
  # >=12.0.0 is not optional: 11.1.1's `_alignValue` lists SLEEP_ASLEEP twice
  # and never lists SLEEP_LIGHT, so every light/Core stage write threw on iOS —
  # ~70% of a night, every night, and it flipped the day's export to failed too.
  health: ^12.2.1
  # Open the Health Connect app/settings so the user can grant per-app access
  # manually (the reliable path when its in-app request dialog is locked out).
  android_intent_plus: ^5.1.0

  # Opt-in, consent-gated companion telemetry + health-data contribution:
  #   • device_info_plus  — OEM / model / OS for crash-report context
  #   • battery_plus       — phone battery + charging state (upload gate)
  #   • connectivity_plus  — Wi-Fi check (only upload the heavy .db on unmetered)
  #   • uuid               — stable anonymous install id (the device_id anchor)
  device_info_plus: ^10.1.2   # capped <11 by `health`
  battery_plus: ^6.1.0
  connectivity_plus: ^6.1.0
  uuid: ^4.5.1

  # Home/lock-screen widget bridge (writes a snapshot to the App Group → WidgetKit).
  home_widget: ^0.6.0

  # OS-level notifications (band battery low / charging, health alerts, recovery,
  # scheduled reminders). The single display layer; see lib/notify/. Local +
  # scheduled only (no FCM — the app is cloud-free).
  flutter_local_notifications: ^18.0.1
  # zonedSchedule needs an initialized tz database + the device's IANA zone, so
  # wind-down / weekly-recap nudges fire at the right wall-clock time.
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1

  # OTA self-update (Android sideload): read our own version, download + install the
  # signed APK from the backend's update pointer, with a browser fallback.
  package_info_plus: ^8.1.0
  ota_update: ^7.1.0
  url_launcher: ^6.3.0
  notification_listener_service: ^1.0.0
  flutter_secure_storage: ^10.3.1
  gpt_markdown: ^1.1.7
  firebase_core: ^4.11.0
  firebase_crashlytics: ^5.2.4
  firebase_performance: ^0.11.4+3
  firebase_analytics: ^12.4.3

# NOTE: to build against the in-tree sibling packages during local development,
# create a (gitignored) pubspec_overrides.yaml — pub auto-detects it. Keeping the
# overrides OUT of this file means CI/release resolves the pinned git refs above
# (the siblings aren't checked out in CI, so a committed path override fails
# `flutter pub get` with exit 66).

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.25.8
  # no_runtime_font_fetch_test parses pubspec.yaml to assert every family the
  # type scale uses is bundled rather than fetched at runtime.
  yaml: ^3.1.2
  flutter_launcher_icons: ^0.13.1
  sqflite_common_ffi: ^2.4.0+3
  # RouteTracker's stall-watchdog tests drive virtual time (was a transitive
  # dep via flutter_test; declared directly since test/ now imports it).
  fake_async: ^1.3.1
  # day_window_dst_test moves the PROCESS timezone via libc setenv/tzset so the
  # DST day-length regressions are real on a non-DST host (transitive via
  # sqflite_common_ffi; declared directly since test/ now imports it).
  ffi: ^2.1.0
  # db_p0_fixes_test swaps PathProviderPlatform.instance for a temp-dir fake so
  # exportDaysDb can run without a platform plugin (transitive via
  # path_provider; declared directly since test/ now imports it).
  path_provider_platform_interface: ^2.1.0
  # ack_commit_sync_full_test wraps the ffi factory in SqfliteDatabaseFactoryLogger
  # to spy the PRAGMA synchronous=FULL/NORMAL bracket around the ACK-gating commit
  # (transitive via sqflite_common_ffi; declared directly since test/ now imports it).
  # PINNED, not a caret range: that constructor is @experimental upstream, so a
  # minor bump is allowed to change or withdraw it and would break the test on
  # someone else's `pub upgrade` rather than on a deliberate one here.
  sqflite_common: 2.5.8

# Run with `dart run flutter_launcher_icons`. TWO THINGS TO KNOW BEFORE YOU DO:
#
#   · 0.13.1 rewrites ios/Runner.xcodeproj/project.pbxproj with a regex that
#     matches ANY `ASSETCATALOG_COMPILER_*` setting and overwrites its value
#     with the app-icon name. On this project that silently sets
#     GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS, GLOBAL_ACCENT_COLOR_NAME and
#     WIDGET_BACKGROUND_COLOR_NAME to "AppIcon" on the widget and watch targets.
#     `git checkout -- ios/Runner.xcodeproj/project.pbxproj` afterwards: the one
#     setting it needs to write (APPICON_NAME = AppIcon) is already correct, and
#     the alternate-icon settings next to it must survive.
#   · It does NOT generate the alternate icon. AppIconBW.appiconset is built by
#     hand from assets/images/icon_bw.png at the same slots as AppIcon.
#
# adaptive_icon_foreground is a PRE-INSET copy of the icon, not the icon itself.
# Android composites both layers on a 108 dp canvas and every launcher mask
# crops it to the middle 72 dp, so full-bleed art is zoomed 1.5x — which was
# cutting the mark off both sides. assets/launcher/ is not a bundled asset dir;
# it is build-time input only.
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icon.png"
  remove_alpha_ios: true
  # The icon's own plate, so the ring the mask leaves around the artwork is the
  # same colour as the artwork's edge rather than the old cream.
  adaptive_icon_background: "#020D1C"
  adaptive_icon_foreground: "assets/launcher/icon_adaptive.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/2.0x/
    - assets/images/3.0x/
  # Both families are bundled, not fetched. google_fonts resolves a missing
  # family over HTTP to fonts.gstatic.com on first launch — before the user
  # has seen the consent screen, and contrary to PRIVACY.md. It also lets the
  # hero readiness numerals flicker or fall back on a cold offline launch.
  # SIL Open Font License (OFL.txt alongside the .ttf files, from
  # https://github.com/google/fonts).
  fonts:
    - family: Barlow Condensed
      fonts:
        - asset: assets/fonts/BarlowCondensed/BarlowCondensed-Bold.ttf
          weight: 700
        - asset: assets/fonts/BarlowCondensed/BarlowCondensed-ExtraBold.ttf
          weight: 800
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope/Manrope-400.ttf
          weight: 400
        - asset: assets/fonts/Manrope/Manrope-500.ttf
          weight: 500
        - asset: assets/fonts/Manrope/Manrope-600.ttf
          weight: 600
        - asset: assets/fonts/Manrope/Manrope-700.ttf
          weight: 700
        - asset: assets/fonts/Manrope/Manrope-800.ttf
          weight: 800
